<app-indexing-progress [showNetworkHashrate]="false" [showPoolsHashrate]="false"></app-indexing-progress>

<div class="full-container">
  <div class="card-header mb-0 mb-md-4">
    <div class="threshold-input">
      <label for="threshold" i18n="mining.min-fee-rate.threshold">Threshold (sat/vB)</label>
      <input type="number" id="threshold" class="form-control form-control-sm form-control-secondary"
        min="0" step="0.01" [formControl]="thresholdControl">
    </div>

    <div class="d-flex d-md-block align-items-baseline">
        <span i18n="mining.min-fee-rate">Minimum Daily Fee Rate</span>
        <button class="btn p-0 ps-2" style="margin: 0 0 4px 0px" (click)="onSaveChart()">
          <fa-icon [icon]="['fas', 'download']" [fixedWidth]="true"></fa-icon>
        </button>
    </div>

    <form [formGroup]="radioGroupForm" class="formRadioGroup" *ngIf="(statsObservable$ | async) as stats">
      <div class="btn-group" role="group" name="radioBasic">
        <ng-container *ngIf="stats.dayCount >= 30">
          <input type="radio" class="btn-check" id="minfeerate-1m" [value]="'1m'" fragment="1m" [routerLink]="['/graphs/mining/min-fee-rate' | relativeUrl]" formControlName="dateSpan">
          <label class="btn btn-primary btn-sm" for="minfeerate-1m">1M</label>
        </ng-container>
        <ng-container *ngIf="stats.dayCount >= 90">
          <input type="radio" class="btn-check" id="minfeerate-3m" [value]="'3m'" fragment="3m" [routerLink]="['/graphs/mining/min-fee-rate' | relativeUrl]" formControlName="dateSpan">
          <label class="btn btn-primary btn-sm" for="minfeerate-3m">3M</label>
        </ng-container>
        <ng-container *ngIf="stats.dayCount >= 180">
          <input type="radio" class="btn-check" id="minfeerate-6m" [value]="'6m'" fragment="6m" [routerLink]="['/graphs/mining/min-fee-rate' | relativeUrl]" formControlName="dateSpan">
          <label class="btn btn-primary btn-sm" for="minfeerate-6m">6M</label>
        </ng-container>
        <ng-container *ngIf="stats.dayCount >= 365">
          <input type="radio" class="btn-check" id="minfeerate-1y" [value]="'1y'" fragment="1y" [routerLink]="['/graphs/mining/min-fee-rate' | relativeUrl]" formControlName="dateSpan">
          <label class="btn btn-primary btn-sm" for="minfeerate-1y">1Y</label>
        </ng-container>
        <ng-container *ngIf="stats.dayCount >= 730">
          <input type="radio" class="btn-check" id="minfeerate-2y" [value]="'2y'" fragment="2y" [routerLink]="['/graphs/mining/min-fee-rate' | relativeUrl]" formControlName="dateSpan">
          <label class="btn btn-primary btn-sm" for="minfeerate-2y">2Y</label>
        </ng-container>
        <ng-container *ngIf="stats.dayCount >= 1095">
          <input type="radio" class="btn-check" id="minfeerate-3y" [value]="'3y'" fragment="3y" [routerLink]="['/graphs/mining/min-fee-rate' | relativeUrl]" formControlName="dateSpan">
          <label class="btn btn-primary btn-sm" for="minfeerate-3y">3Y</label>
        </ng-container>
        <input type="radio" class="btn-check" id="minfeerate-all" [value]="'all'" fragment="all" [routerLink]="['/graphs/mining/min-fee-rate' | relativeUrl]" formControlName="dateSpan">
        <label class="btn btn-primary btn-sm" for="minfeerate-all">ALL</label>
      </div>
    </form>
  </div>


  <div class="chart" *browserOnly echarts [initOpts]="chartInitOptions" [options]="chartOptions"
    (chartInit)="onChartInit($event)" [style]="{opacity: isLoading ? 0.5 : 1}">
  </div>
  <div class="text-center loadingGraphs" *ngIf="!stateService.isBrowser || isLoading">
    <div class="spinner-border text-light"></div>
  </div>

</div>
