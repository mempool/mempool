<section class="overview-widget">
  <div class="widget-heading">
    <h2 i18n="watch.balance">Balance</h2>
  </div>
  <div class="box widget-box">
    <ng-container *ngIf="view; else loading">
      <!-- One grid for both rows so the digits line up; the sign hangs left of its number. -->
      <div class="balance-values">
        <div class="balance-value-row">
          <span class="stat-label" i18n="watch.confirmed">Confirmed</span>
          <span class="balance-btc"><span class="signed">
            <app-amount [satoshis]="view.balance.confirmed" [forceBtc]="true" [ignoreViewMode]="true" [noFiat]="true"></app-amount>
          </span></span>
          <span class="balance-fiat"><span class="signed"><app-fiat [value]="view.balance.confirmed"></app-fiat></span></span>
        </div>
        <div class="balance-value-row" [class.text-success]="view.balance.pending > 0" [class.text-danger]="view.balance.pending < 0" [class.zero-balance]="view.balance.pending === 0">
          <span class="stat-label" i18n="watch.in-mempool">In mempool</span>
          <span class="balance-btc"><span class="signed">
            <span class="sign">{{ pendingSign }}</span>
            <app-amount [satoshis]="pendingMagnitude" [forceBtc]="true" [ignoreViewMode]="true" [noFiat]="true"></app-amount>
          </span></span>
          <span class="balance-fiat"><span class="signed">
            <span class="sign">{{ pendingSign }}</span>
            <app-fiat [value]="pendingMagnitude"></app-fiat>
          </span></span>
        </div>
      </div>
      <div class="balance-history">
        <app-address-graph *ngIf="view.history.length; else noHistory" [addressSummary$]="history$" period="all" left="80"></app-address-graph>
        <ng-template #noHistory><p class="text-muted mb-0" i18n="watch.no-history">No balance history yet.</p></ng-template>
      </div>
    </ng-container>
    <ng-template #loading>
      <p class="text-muted mb-0" *ngIf="!state.scanning && state.error; else scanning" i18n="watch.load-failed-try-again">The wallet could not be loaded. Try again, or change or forget it in Settings.</p>
    </ng-template>
    <ng-template #scanning>
      <div class="wallet-state-loading">
        <div role="status" aria-live="polite"><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>{{ loadingTitle }}</div>
        <app-watch-scan-status *ngIf="state.progress as progress" [progress]="progress"></app-watch-scan-status>
      </div>
    </ng-template>
  </div>
</section>
