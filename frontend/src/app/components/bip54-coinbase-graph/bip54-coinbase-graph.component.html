<app-indexing-progress [showNetworkHashrate]="false" [showPoolsHashrate]="false"></app-indexing-progress>

<div class="full-container">

  <div class="card-header">
    <div class="d-flex d-md-table-cell align-items-baseline">
      <span i18n="mining.bip54-coinbase">BIP-54 Coinbase Adoption</span>
      <button class="btn p-0 ps-2" style="margin: 0 0 4px 0px" (click)="onSaveChart()">
        <fa-icon [icon]="['fas', 'download']" [fixedWidth]="true"></fa-icon>
      </button>
    </div>
    <form [formGroup]="radioGroupForm" class="formRadioGroup" *ngIf="(miningStatsObservable$ | async) as stats">
      <div class="btn-group" role="group" name="radioBasic">
        <ng-container *ngIf="stats.totalBlockCount >= 144">
          <input type="radio" class="btn-check" id="bip54-24h" [value]="'24h'" fragment="24h" [routerLink]="['/graphs/mining/bip54-coinbase' | relativeUrl]" [attr.data-cy]="'24h'" formControlName="dateSpan">
          <label class="btn btn-primary btn-sm" for="bip54-24h">24h</label>
        </ng-container>
        <ng-container *ngIf="stats.totalBlockCount >= 432">
          <input type="radio" class="btn-check" id="bip54-3d" [value]="'3d'" fragment="3d" [routerLink]="['/graphs/mining/bip54-coinbase' | relativeUrl]" [attr.data-cy]="'3d'" formControlName="dateSpan">
          <label class="btn btn-primary btn-sm" for="bip54-3d">3D</label>
        </ng-container>
        <ng-container *ngIf="stats.totalBlockCount >= 1008">
          <input type="radio" class="btn-check" id="bip54-1w" [value]="'1w'" fragment="1w" [routerLink]="['/graphs/mining/bip54-coinbase' | relativeUrl]" [attr.data-cy]="'1w'" formControlName="dateSpan">
          <label class="btn btn-primary btn-sm" for="bip54-1w">1W</label>
        </ng-container>
        <ng-container *ngIf="stats.totalBlockCount >= 4320">
          <input type="radio" class="btn-check" id="bip54-1m" [value]="'1m'" fragment="1m" [routerLink]="['/graphs/mining/bip54-coinbase' | relativeUrl]" [attr.data-cy]="'1m'" formControlName="dateSpan">
          <label class="btn btn-primary btn-sm" for="bip54-1m">1M</label>
        </ng-container>
        <ng-container *ngIf="stats.totalBlockCount >= 12960">
          <input type="radio" class="btn-check" id="bip54-3m" [value]="'3m'" fragment="3m" [routerLink]="['/graphs/mining/bip54-coinbase' | relativeUrl]" [attr.data-cy]="'3m'" formControlName="dateSpan">
          <label class="btn btn-primary btn-sm" for="bip54-3m">3M</label>
        </ng-container>
        <ng-container *ngIf="stats.totalBlockCount >= 25920">
          <input type="radio" class="btn-check" id="bip54-6m" [value]="'6m'" fragment="6m" [routerLink]="['/graphs/mining/bip54-coinbase' | relativeUrl]" [attr.data-cy]="'6m'" formControlName="dateSpan">
          <label class="btn btn-primary btn-sm" for="bip54-6m">6M</label>
        </ng-container>
      </div>
    </form>
  </div>

  <div class="container pb-lg-0">
    <ng-container *ngIf="bip54DataAvailable">
      <div class="chart" *browserOnly [style]="{ opacity: isLoading ? 0.5 : 1 }" echarts [initOpts]="chartInitOptions" [options]="chartOptions"
        (chartInit)="onChartInit($event)">
      </div>
    </ng-container>

    <div class="text-center unavailable" *ngIf="!bip54DataAvailable" i18n="mining.bip54-unavailable">
      BIP-54 adoption data is not available from this backend.
    </div>

    <div class="text-center loadingGraphs" *ngIf="!stateService.isBrowser || isLoading">
      <div class="spinner-border text-light"></div>
    </div>
  </div>
</div>
